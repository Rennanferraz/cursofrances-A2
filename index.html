verbe selon le sens et la position"],"situationFr":"Vous comparez deux cours, plusieurs cafés et des objets utiles avant de choisir.","available":false},{"id":"u13","order":13,"titleFr":"Se repérer dans la ville","classification":"A2 — Parcours principal","objectivesFr":["Situer un lieu par rapport à un autre","Indiquer une origine et une destination","Choisir une préposition pour un pays ou un transport","Demander et expliquer un trajet simple"],"situationFr":"Vous cherchez une salle de cours dans un quartier fictif et vous guidez une personne depuis un arrêt de bus.","available":false},{"id":"u14","order":14,"titleFr":"Organiser le temps","classification":"A2 — Parcours principal","objectivesFr":["Lire et proposer une date et une heure","Distinguer moment, durée et délai","Choisir depuis, pendant, il y a, dans et en selon le contexte","Organiser des étapes et confirmer un rendez-vous"],"situationFr":"Vous organisez des rendez-vous, comparez des durées et expliquez votre calendrier à une autre personne.","available":false},{"id":"u15","order":15,"titleFr":"Une action récente, en cours ou prévue","classification":"A2 — Parcours principal","objectivesFr":["Former trois constructions avec un infinitif","Distinguer une action récente, une action en cours et un projet","Placer la négation et le pronom d’un infinitif","Expliquer ce qui change dans un programme"],"situationFr":"Vous échangez des nouvelles et coordonnez un rendez-vous en disant ce qui vient de se passer, ce qui se passe et ce qui est prévu.","available":false},{"id":"u16","order":16,"titleFr":"Le passé composé avec avoir","classification":"A2 — Parcours principal","objectivesFr":["Former le passé composé avec avoir","Choisir des participes passés fréquents","Raconter des événements présentés comme un tout","Placer la négation et organiser un petit récit"],"situationFr":"Vous racontez des achats, un repas et une séance de cours, en présentant les étapes qui ont eu lieu.","available":false},{"id":"u17","order":17,"titleFr":"Le passé composé avec être","classification":"A2 — Parcours principal","objectivesFr":["Choisir être dans les constructions étudiées","Accorder le participe avec le sujet dans les cas simples","Raconter une arrivée, un départ et un retour","Employer des verbes pronominaux au passé avec les précautions enseignées"],"situationFr":"Vous racontez un déplacement et les étapes d’une journée, en précisant qui a fait chaque action.","available":false},{"id":"u18","order":18,"titleFr":"L’imparfait","classification":"A2 — Parcours principal","objectivesFr":["Former l’imparfait à partir du présent avec nous","Décrire un cadre, un état et une habitude dans le passé","Placer la négation et les pronoms dans une forme simple","Raconter une ancienne routine sans confondre durée et perspective"],"situationFr":"Vous décrivez un ancien logement, vos premières habitudes de travail ou un cours que vous suiviez autrefois.","available":false},{"id":"passe-compose-imparfait","order":19,"titleFr":"Le passé composé vs l’imparfait","classification":"A2 — Parcours principal","objectivesFr":["Choisir une perspective pour raconter le passé","Former et accorder les deux temps dans les cas étudiés","Distinguer un événement, une habitude et un cadre","Expliquer un changement de sens quand le temps change","Construire un récit avec les deux temps"],"situationFr":"Vous racontez une expérience de transport, de repas, de logement ou de cours, en distinguant les événements et leur contexte.","available":true},{"id":"u20","order":20,"titleFr":"Raconter une expérience","classification":"A2 — Parcours principal","objectivesFr":["Planifier un récit bref avec un début et un résultat","Relier le cadre et les événements sans perdre les référents","Adapter un souvenir à un message personnel ou à un échange oral","Résumer une courte biographie sans inventer de faits"],"situationFr":"Vous racontez une expérience de voyage, de travail ou de cours à une personne qui n’était pas présente.","available":false},{"id":"u21","order":21,"titleFr":"Le futur simple et les projets","classification":"A2 — Parcours principal","objectivesFr":["Former le futur simple des verbes travaillés","Exprimer un projet, une prévision et un engagement","Comparer le futur simple et le futur proche sans règle de distance","Organiser des étapes futures dans un message"],"situationFr":"Vous présentez un projet de formation et vous répartissez les prochaines étapes avec un groupe.","available":false},{"id":"u22","order":22,"titleFr":"Demander poliment et proposer","classification":"A2 — Parcours principal","objectivesFr":["Former le conditionnel présent des verbes utiles","Demander un service sans imposer une réponse","Exprimer un souhait, un conseil et une proposition","Accepter ou refuser une invitation avec une justification courte"],"situationFr":"Vous demandez une aide, proposez une activité et négociez une invitation en adaptant le registre.","available":false},{"id":"u23","order":23,"titleFr":"Exprimer une condition simple","classification":"A2 — Parcours principal","objectivesFr":["Relier une condition possible et sa conséquence","Choisir le présent après si dans le modèle étudié","Proposer une activité avec Et si on… ?","Distinguer une condition, un moment et une question indirecte"],"situationFr":"Vous préparez une rencontre et vous expliquez ce qui changera selon les disponibilités du groupe.","available":false},{"id":"u24","order":24,"titleFr":"Les pronoms compléments directs","classification":"A2 — Parcours principal","objectivesFr":["Identifier un complément direct selon le verbe français","Remplacer une personne ou une chose par un pronom direct","Placer le pronom dans une négation, un infinitif et un temps composé","Éviter une répétition sans perdre le référent"],"situationFr":"Vous échangez des documents, confirmez une lecture et précisez qui vous attendez.","available":false},{"id":"u25","order":25,"titleFr":"Les pronoms compléments indirects","classification":"A2 — Parcours principal","objectivesFr":["Reconnaître les constructions indirectes travaillées","Remplacer à une personne par lui ou leur avec les verbes appropriés","Distinguer un pronom direct, indirect et tonique","Placer un pronom indirect dans les constructions connues"],"situationFr":"Vous répondez à des collègues, transmettez une information et choisissez à qui demander une précision.","available":false},{"id":"u26","order":26,"titleFr":"Les pronoms y et en","classification":"A2 — Parcours principal","objectivesFr":["Remplacer un lieu connu par y","Remplacer une quantité ou un groupe avec de par en dans les usages étudiés","Conserver les nombres et quantités nécessaires","Placer y et en sans les confondre avec les autres pronoms"],"situationFr":"Vous organisez un trajet, achetez des aliments et répondez à des questions sans répéter les mêmes groupes.","available":false},{"id":"u27","order":27,"titleFr":"Remplacer et préciser","classification":"A2 — Parcours principal","objectivesFr":["Distinguer un déterminant et un pronom dans un contexte","Employer les pronoms possessifs et démonstratifs d’identification","Parler d’une personne ou d’une chose non précisée","Utiliser chaque, quelques, plusieurs, certains et tout selon leur fonction"],"situationFr":"Vous identifiez des objets dans un espace partagé et répartissez du matériel entre plusieurs personnes.","available":false},{"id":"u28","order":28,"titleFr":"Relier avec qui, que et où","classification":"A2 — Parcours principal","objectivesFr":["Relier deux informations avec une relative simple","Choisir qui comme sujet et que comme complément direct","Employer où pour un lieu ou un moment","Rédiger une description claire sans répétition inutile"],"situationFr":"Vous décrivez une personne, un objet utile et un lieu de rencontre pour que votre interlocuteur les identifie.","available":false},{"id":"u29","order":29,"titleFr":"Expliquer et organiser ses idées","classification":"A2 — Parcours principal","objectivesFr":["Relier des idées par addition, alternative et contraste","Exprimer une cause avec une construction adaptée","Présenter une conséquence et un objectif","Organiser un message court dans un ordre clair"],"situationFr":"Vous comparez deux solutions de transport et justifiez un choix dans un message à un proche.","available":false},{"id":"u30","order":30,"titleFr":"Parler de sa santé et de ses sensations","classification":"A2 — Parcours principal","objectivesFr":["Nommer des parties du corps et des sensations courantes","Décrire un symptôme avec une durée et une intensité simples","Demander un rendez-vous ou de l’aide en français","Vérifier une information sans inventer de conseil médical"],"situationFr":"Vous téléphonez pour un rendez-vous fictif et vous décrivez ce que vous ressentez avec des phrases simples.","available":false},{"id":"u31","order":31,"titleFr":"Se loger et utiliser les services","classification":"A2 — Parcours principal","objectivesFr":["Décrire un logement, ses pièces et ses équipements","Expliquer un problème observable dans un message","Demander un renseignement ou un rendez-vous à un service","Lire et remplir un formulaire fictif avec des données adaptées"],"situationFr":"Vous décrivez un appartement fictif, signalez un équipement qui ne fonctionne pas et confirmez un passage avec un service.","available":false},{"id":"u32","order":32,"titleFr":"Faire des achats","classification":"A2 — Parcours principal","objectivesFr":["Décrire un vêtement par sa taille, sa couleur et sa matière","Demander un prix et une information de paiement dans un scénario","Comparer deux articles et exprimer une préférence","Expliquer un problème d’achat et demander les possibilités sans présumer une règle"],"situationFr":"Vous choisissez un vêtement fictif, vérifiez les informations utiles et expliquez un problème avec un article.","available":false},{"id":"u33","order":33,"titleFr":"Voyager et se déplacer","classification":"A2 — Parcours principal","objectivesFr":["Préparer un trajet et choisir un billet","Demander et confirmer des horaires","Réagir à un retard ou à un changement","Organiser une réservation et raconter un déplacement"],"situationFr":"Vous préparez un week-end, puis vous adaptez votre trajet à un imprévu. Les horaires et les services de cette unité sont fictifs.","available":false},{"id":"u34","order":34,"titleFr":"Travailler et étudier","classification":"A2 — Parcours principal","objectivesFr":["Présenter son travail et ses études","Décrire des tâches et une expérience","Demander des renseignements sur une formation","Écrire et transmettre un message pratique"],"situationFr":"Vous présentez votre parcours, choisissez un cours et échangez des informations avec une équipe. Les offres et les procédures présentées sont fictives.","available":false},{"id":"u35","order":35,"titleFr":"Les loisirs et la vie culturelle","classification":"A2 — Parcours principal","objectivesFr":["Parler de ses loisirs et de ses préférences","Lire une annonce et organiser une sortie","Inviter, accepter et refuser poliment","Remercier, s’excuser et raconter une rencontre"],"situationFr":"Vous préparez une sortie avec des amis et participez à une rencontre culturelle fictive avec des personnes de plusieurs régions francophones.","available":false},{"id":"u36","order":36,"titleFr":"Le temps, la nature et les gestes quotidiens","classification":"A2 — Parcours principal","objectivesFr":["Décrire le temps et une température","Organiser une activité selon une prévision","Comprendre une consigne de tri dans un document","Proposer des gestes simples et expliquer leur but"],"situationFr":"Votre groupe organise un atelier près d’un jardin. Vous consultez une prévision fictive et préparez des consignes simples pour la journée.","available":false}],"blocks":[{"nameFr":"Les premiers repères","range":[1,5],"subtitlePt":"Apresentação, descrição e perguntas"},{"nameFr":"Le quotidien en français","range":[6,10],"subtitlePt":"Respostas, relações, rotina e orientações"},{"nameFr":"Agir et se repérer","range":[11,15],"subtitlePt":"Quantidade, comparação, espaço e tempo"},{"nameFr":"Raconter le passé","range":[16,20],"subtitlePt":"Passé composé, imparfait e narrativa"},{"nameFr":"Projets et interactions","range":[21,25],"subtitlePt":"Projetos, pedidos e complementos"},{"nameFr":"Relier et préciser","range":[26,30],"subtitlePt":"Pronomes, relações entre ideias e sensações"},{"nameFr":"Vivre, travailler, découvrir","range":[31,35],"subtitlePt":"Moradia, compras, viagens, trabalho e lazer"},{"nameFr":"Le monde autour de soi","range":[36,36],"subtitlePt":"Tempo, natureza e gestos cotidianos"}],"questions":[{"id":"passe-compose-imparfait-c01","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Une femme raconte son arrivée. Choisissez la forme complète correcte.","sentenceFr":"","options":[{"id":"a","textFr":"Je suis arrivée."},{"id":"b","textFr":"J’ai arrivée."},{"id":"c","textFr":"Je suis arrivé."},{"id":"d","textFr":"Je suis arriver."}],"correctOptionId":"a","explanationPt":"Arriver usa être nesse uso e o particípio concorda com a narradora feminina.","topicIds":["passe-compose-imparfait.pc-forme"],"helpIndex":0,"group":"checkpoint","sourceRef":"19.json / sections[0].checkpoint"},{"id":"passe-compose-imparfait-c02","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Choisissez faire à l’imparfait avec nous, à partir de nous faisons.","sentenceFr":"","options":[{"id":"a","textFr":"Nous faisons."},{"id":"b","textFr":"Nous faisions."},{"id":"c","textFr":"Nous avons fait."},{"id":"d","textFr":"Nous faisaient."}],"correctOptionId":"b","explanationPt":"A base fais- recebe ions ; não se usa o particípio fait na formação do imperfeito.","topicIds":["passe-compose-imparfait.imp-forme"],"helpIndex":1,"group":"checkpoint","sourceRef":"19.json / sections[1].checkpoint"},{"id":"passe-compose-imparfait-c03","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Dans « La salle était froide, alors nous avons fermé la fenêtre », quelle partie fait avancer la suite des événements ?","sentenceFr":"","options":[{"id":"a","textFr":"La salle était froide."},{"id":"b","textFr":"Les deux parties décrivent uniquement le décor."},{"id":"c","textFr":"Nous avons fermé la fenêtre."},{"id":"d","textFr":"Aucune partie ne raconte un événement."}],"correctOptionId":"c","explanationPt":"A condição da sala fornece o contexto ; o fechamento é relatado como uma ação dentro da sequência.","topicIds":["passe-compose-imparfait.cadre-evenement"],"helpIndex":2,"group":"checkpoint","sourceRef":"19.json / sections[2].checkpoint"},{"id":"passe-compose-imparfait-c04","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Pourquoi « six fois pendant ce stage » peut-il apparaître au passé composé ?","sentenceFr":"","options":[{"id":"a","textFr":"Parce que toute répétition exige ce temps."},{"id":"b","textFr":"Parce que six est toujours un marqueur du passé composé."},{"id":"c","textFr":"Parce que les trajets étaient forcément très courts."},{"id":"d","textFr":"Parce que le locuteur présente un ensemble délimité d’occurrences comme un bilan."}],"correctOptionId":"d","explanationPt":"Repetição não basta para impor imperfeito ; contar um total delimitado é outra perspectiva.","topicIds":["passe-compose-imparfait.habitude-bilan"],"helpIndex":3,"group":"checkpoint","sourceRef":"19.json / sections[3].checkpoint"},{"id":"passe-compose-imparfait-c05","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Dans une activité au moment d’une arrivée, l’imparfait signifie-t-il que l’activité est restée inachevée pour toujours ?","sentenceFr":"","options":[{"id":"a","textFr":"Non. Il ne donne pas à lui seul cette information."},{"id":"b","textFr":"Oui. Toute activité à l’imparfait reste inachevée."},{"id":"c","textFr":"Oui, mais seulement si la phrase contient quand."},{"id":"d","textFr":"Non. Il affirme au contraire que l’activité était déjà terminée."}],"correctOptionId":"a","explanationPt":"O tempo focaliza o andamento no ponto de referência ; o resultado posterior depende do restante do relato.","topicIds":["passe-compose-imparfait.encours"],"helpIndex":4,"group":"checkpoint","sourceRef":"19.json / sections[4].checkpoint"},{"id":"passe-compose-imparfait-c06","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Une attente de quarante minutes oblige-t-elle l’imparfait parce qu’elle est longue ?","sentenceFr":"","options":[{"id":"a","textFr":"Oui. Toute attente de plus de dix minutes exige l’imparfait."},{"id":"b","textFr":"Non. Elle peut être racontée comme un épisode entier au passé composé."},{"id":"c","textFr":"Oui. Le passé composé ne peut raconter qu’une seconde."},{"id":"d","textFr":"Non. Sa durée impose le futur simple."}],"correctOptionId":"b","explanationPt":"O ponto de vista é decisivo ; a extensão no relógio não impõe o tempo.","topicIds":["passe-compose-imparfait.duree"],"helpIndex":5,"group":"checkpoint","sourceRef":"19.json / sections[5].checkpoint"},{"id":"passe-compose-imparfait-c07","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"« Je pouvais venir » affirme-t-il nécessairement que la personne est effectivement venue ?","sentenceFr":"","options":[{"id":"a","textFr":"Oui. Pouvais prouve toujours la réalisation."},{"id":"b","textFr":"Oui, parce que venir est un verbe de mouvement."},{"id":"c","textFr":"Non. La phrase présente une possibilité dans le contexte."},{"id":"d","textFr":"Non. La phrase affirme que la personne ne pouvait pas venir."}],"correctOptionId":"c","explanationPt":"A realização pode ser explicitada depois. J’ai pu venir, no cenário contrastado, apresenta a possibilidade concretizada.","topicIds":["passe-compose-imparfait.paires-sens"],"helpIndex":6,"group":"checkpoint","sourceRef":"19.json / sections[6].checkpoint"},{"id":"passe-compose-imparfait-c08","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Dans « j’étudiais depuis trois mois quand j’ai changé de groupe », les trois mois vont-ils nécessairement jusqu’à aujourd’hui ?","sentenceFr":"","options":[{"id":"a","textFr":"Oui. Depuis renvoie toujours au présent."},{"id":"b","textFr":"Oui. Le changement de groupe a forcément lieu aujourd’hui."},{"id":"c","textFr":"Non. La phrase indique que les études ont duré seulement un jour."},{"id":"d","textFr":"Non. Ils vont jusqu’au point passé du changement de groupe."}],"correctOptionId":"d","explanationPt":"Depuis se relaciona ao ponto de referência do relato, que aqui é passado.","topicIds":["passe-compose-imparfait.marqueurs"],"helpIndex":7,"group":"checkpoint","sourceRef":"19.json / sections[7].checkpoint"},{"id":"passe-compose-imparfait-c09","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Que faut-il vérifier après avoir choisi la perspective ?","sentenceFr":"","options":[{"id":"a","textFr":"La formation : base ou auxiliaire, terminaison ou participe, et accord nécessaire."},{"id":"b","textFr":"Seulement la présence du mot hier."},{"id":"c","textFr":"Seulement la durée de l’action en minutes."},{"id":"d","textFr":"Seulement le nombre de phrases du récit."}],"correctOptionId":"a","explanationPt":"Uma escolha de tempo adequada pode ainda conter erro de forma ; os dois controles são complementares.","topicIds":["passe-compose-imparfait.strategie"],"helpIndex":8,"group":"checkpoint","sourceRef":"19.json / sections[8].checkpoint"},{"id":"passe-compose-imparfait-c10","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Dans un souvenir, peut-on employer les deux temps ?","sentenceFr":"","options":[{"id":"a","textFr":"Non. Un souvenir doit être entièrement à l’imparfait."},{"id":"b","textFr":"Oui. Le souvenir peut contenir un cadre, des habitudes et des événements."},{"id":"c","textFr":"Non. Une histoire terminée doit être entièrement au passé composé."},{"id":"d","textFr":"Oui, à condition d’alterner les deux temps après chaque phrase."}],"correctOptionId":"b","explanationPt":"O gênero lembrança não impõe um tempo único ; a organização da informação determina a perspectiva de cada parte.","topicIds":["passe-compose-imparfait.recit"],"helpIndex":9,"group":"checkpoint","sourceRef":"19.json / sections[9].checkpoint"},{"id":"passe-compose-imparfait-q01","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Ana raconte un achat unique comme une étape réalisée de sa journée.","sentenceFr":"Au marché, elle ____ deux kilos de tomates, puis elle est rentrée.","targetSkill":"passe-compose-imparfait.pc-forme","targetStructure":"pc-forme","topicIds":["passe-compose-imparfait.pc-forme"],"options":[{"id":"a","textFr":"a acheté"},{"id":"b","textFr":"achetait"},{"id":"c","textFr":"achète"},{"id":"d","textFr":"va acheter"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Au marché, elle a acheté deux kilos de tomates, puis elle est rentrée.","explanationPt":"O enunciado recorta a compra como etapa realizada antes do retorno. Passé composé com avoir : a acheté ; a repetição ou o andamento não são o foco pedido.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":0},{"id":"passe-compose-imparfait-q02","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Décrivez la routine d’une ancienne période, sans compter des trajets précis.","sentenceFr":"À cette époque, nous ____ le train chaque mardi.","targetSkill":"passe-compose-imparfait.imp-forme","targetStructure":"imp-forme","topicIds":["passe-compose-imparfait.imp-forme"],"options":[{"id":"a","textFr":"prenions"},{"id":"b","textFr":"avons pris"},{"id":"c","textFr":"prenons"},{"id":"d","textFr":"allons prendre"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"À cette époque, nous prenions le train chaque mardi.","explanationPt":"A perspectiva de rotina contextual pede prenions, base pren- mais ions. Um balanço delimitado poderia usar outro tempo em outro contexto.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":1},{"id":"passe-compose-imparfait-q03","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Décrivez le décor tel qu’il se présentait au moment de l’arrivée, sans raconter un changement de taille.","sentenceFr":"Quand Ana est arrivée, la salle ____ petite et pleine de monde.","targetSkill":"passe-compose-imparfait.cadre-evenement","targetStructure":"cadre-evenement","topicIds":["passe-compose-imparfait.cadre-evenement"],"options":[{"id":"a","textFr":"était"},{"id":"b","textFr":"a été"},{"id":"c","textFr":"est"},{"id":"d","textFr":"sera"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Quand Ana est arrivée, la salle était petite et pleine de monde.","explanationPt":"Était descreve a característica da cena naquele momento. A frase não conta uma transformação da sala nem informa seu estado atual.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":2},{"id":"passe-compose-imparfait-q04","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Faites le bilan exact de six trajets pendant un stage terminé de deux semaines.","sentenceFr":"Pendant ce stage, j’____ le bus six fois au total.","targetSkill":"passe-compose-imparfait.habitude-bilan","targetStructure":"habitude-bilan","topicIds":["passe-compose-imparfait.habitude-bilan"],"options":[{"id":"a","textFr":"ai pris"},{"id":"b","textFr":"prenais"},{"id":"c","textFr":"ai prendre"},{"id":"d","textFr":"prends"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Pendant ce stage, j’ai pris le bus six fois au total.","explanationPt":"As seis ocorrências formam um total delimitado apresentado globalmente : ai pris. Repetição não impõe imperfeito.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":3},{"id":"passe-compose-imparfait-q05","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"La préparation était déjà en cours au moment où le téléphone a sonné ; on ne précise pas encore sa fin.","sentenceFr":"Je ____ la soupe quand le téléphone a sonné.","targetSkill":"passe-compose-imparfait.encours","targetStructure":"encours","topicIds":["passe-compose-imparfait.encours"],"options":[{"id":"a","textFr":"préparais"},{"id":"b","textFr":"ai préparé"},{"id":"c","textFr":"prépare"},{"id":"d","textFr":"vais préparer"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Je préparais la soupe quand le téléphone a sonné.","explanationPt":"Préparais mostra a atividade em curso no ponto passado. A frase não afirma que a sopa nunca foi terminada.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":4},{"id":"passe-compose-imparfait-q06","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Racontez toute l’attente comme un épisode terminé avant la décision de marcher.","sentenceFr":"J’____ quarante minutes, puis j’ai décidé de rentrer à pied.","targetSkill":"passe-compose-imparfait.duree","targetStructure":"duree","topicIds":["passe-compose-imparfait.duree"],"options":[{"id":"a","textFr":"ai attendu"},{"id":"b","textFr":"attendais"},{"id":"c","textFr":"attends"},{"id":"d","textFr":"vais attendre"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"J’ai attendu quarante minutes, puis j’ai décidé de rentrer à pied.","explanationPt":"A espera longa é recortada como um todo anterior à decisão. A duração não proíbe passé composé.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":5},{"id":"passe-compose-imparfait-q07","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"La personne a effectivement participé grâce à un nouvel horaire ; exprimez cette possibilité réalisée.","sentenceFr":"Grâce au changement, j’____ venir au cours samedi.","targetSkill":"passe-compose-imparfait.paires-sens","targetStructure":"paires-sens","topicIds":["passe-compose-imparfait.paires-sens"],"options":[{"id":"a","textFr":"ai pu"},{"id":"b","textFr":"pouvais"},{"id":"c","textFr":"peux"},{"id":"d","textFr":"vais pouvoir"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Grâce au changement, j’ai pu venir au cours samedi.","explanationPt":"Ai pu apresenta, neste cenário, a possibilidade concretizada. Pouvais descreveria disponibilidade sem afirmar sozinho a participação.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":6},{"id":"passe-compose-imparfait-q08","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Hier à huit heures, on observe une attente déjà en cours ; on ne fait pas le bilan de sa durée.","sentenceFr":"Hier, à huit heures, les voyageurs ____ encore devant l’arrêt.","targetSkill":"passe-compose-imparfait.marqueurs","targetStructure":"marqueurs","topicIds":["passe-compose-imparfait.marqueurs"],"options":[{"id":"a","textFr":"attendaient"},{"id":"b","textFr":"ont attendu"},{"id":"c","textFr":"attendent"},{"id":"d","textFr":"vont attendre"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Hier, à huit heures, les voyageurs attendaient encore devant l’arrêt.","explanationPt":"Hier situe le jour ; a perspectiva explícita de atividade em curso pede attendaient, não uma escolha automática por marcador.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":7},{"id":"passe-compose-imparfait-q09","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"La narratrice est une femme. Présentez son arrivée comme l’événement suivant une demande de plan.","sentenceFr":"J’ai demandé un plan, puis je ____ au centre à dix-neuf heures.","targetSkill":"passe-compose-imparfait.strategie","targetStructure":"strategie","topicIds":["passe-compose-imparfait.strategie"],"options":[{"id":"a","textFr":"suis arrivée"},{"id":"b","textFr":"arrivais"},{"id":"c","textFr":"suis arrivé"},{"id":"d","textFr":"ai arrivée"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"J’ai demandé un plan, puis je suis arrivée au centre à dix-neuf heures.","explanationPt":"O evento recortado pede passé composé ; arriver usa être e a narradora feminina exige arrivée.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":8},{"id":"passe-compose-imparfait-q10","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Au début du récit, décrivez l’activité simultanée d’Ana pendant la préparation, sans la compter comme épisode clos.","sentenceFr":"Pendant que je préparais le repas, Ana ____ le message du cours.","targetSkill":"passe-compose-imparfait.recit","targetStructure":"recit","topicIds":["passe-compose-imparfait.recit"],"options":[{"id":"a","textFr":"lisait"},{"id":"b","textFr":"a lu"},{"id":"c","textFr":"lit"},{"id":"d","textFr":"va lire"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Pendant que je préparais le repas, Ana lisait le message du cours.","explanationPt":"Lisait e préparais apresentam duas atividades simultâneas de fundo. Nenhuma é recortada aqui como etapa concluída.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":9},{"id":"passe-compose-imparfait-q11","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Présentez la préparation comme un événement réalisé dans la suite du récit. Choisissez la forme de faire avec nous.","sentenceFr":"Ensuite, nous ____ une salade et nous avons mis la table.","targetSkill":"passe-compose-imparfait.pc-forme","targetStructure":"pc-forme","topicIds":["passe-compose-imparfait.pc-forme"],"options":[{"id":"a","textFr":"avons fait"},{"id":"b","textFr":"faisions"},{"id":"c","textFr":"avons faire"},{"id":"d","textFr":"ont fait"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Ensuite, nous avons fait une salade et nous avons mis la table.","explanationPt":"O encadeamento de acontecimentos pede avons fait ; fait é o particípio de faire. Faisions pode descrever uma atividade em andamento, mas não é a perspectiva delimitada aqui. Avons faire não contém particípio; ont não concorda com nous.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":0},{"id":"passe-compose-imparfait-q12","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Décrivez l’état du groupe au début de la scène, sans raconter un changement. Choisissez être avec nous.","sentenceFr":"Au début de la soirée, nous ____ fatigués et la salle était calme.","targetSkill":"passe-compose-imparfait.imp-forme","targetStructure":"imp-forme","topicIds":["passe-compose-imparfait.imp-forme"],"options":[{"id":"a","textFr":"avons été"},{"id":"b","textFr":"étions"},{"id":"c","textFr":"étiez"},{"id":"d","textFr":"étaient"}],"correctOptionId":"b","acceptedAnswers":[],"completedSentenceFr":"Au début de la soirée, nous étions fatigués et la salle était calme.","explanationPt":"Être no imperfeito usa ét- mais ions. O estado compõe o contexto inicial. Avons été apresentaria o estado como episódio global, perspectiva diferente da descrição de fundo solicitada. Étiez e étaient não concordam com nous.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":1},{"id":"passe-compose-imparfait-q13","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Ana et Clara sont deux femmes. Racontez leur entrée comme l’événement suivant. Choisissez entrer au temps adapté.","sentenceFr":"La salle était prête. Ana et Clara ____ à dix-neuf heures.","targetSkill":"passe-compose-imparfait.cadre-evenement","targetStructure":"cadre-evenement","topicIds":["passe-compose-imparfait.cadre-evenement"],"options":[{"id":"a","textFr":"entraient"},{"id":"b","textFr":"ont entré"},{"id":"c","textFr":"sont entrées"},{"id":"d","textFr":"sont entrés"}],"correctOptionId":"c","acceptedAnswers":[],"completedSentenceFr":"La salle était prête. Ana et Clara sont entrées à dix-neuf heures.","explanationPt":"A entrada faz avançar o relato ; entrer usa être e entrées concorda com as duas mulheres. Entraient focalizaria uma entrada em curso. Para o acontecimento delimitado, usa-se sont entrées: être e concordância feminina plural.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":2},{"id":"passe-compose-imparfait-q14","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Décrivez une ancienne habitude sans faire le bilan d’un nombre d’occurrences. Choisissez déjeuner avec je.","sentenceFr":"Quand je travaillais près du centre, ____ au café le vendredi.","targetSkill":"passe-compose-imparfait.habitude-bilan","targetStructure":"habitude-bilan","topicIds":["passe-compose-imparfait.habitude-bilan"],"options":[{"id":"a","textFr":"j’ai déjeuné"},{"id":"b","textFr":"je déjeunait"},{"id":"c","textFr":"je déjeune"},{"id":"d","textFr":"je déjeunais"}],"correctOptionId":"d","acceptedAnswers":[],"completedSentenceFr":"Quand je travaillais près du centre, je déjeunais au café le vendredi.","explanationPt":"A rotina descrita pede imperfeito ; a base de nous déjeunons é déjeun-. J’ai déjeuné serviria a um balanço delimitado de ocorrências; não é a perspectiva habitual pedida. Je déjeunait erra a pessoa; je déjeune muda para o presente.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":3},{"id":"passe-compose-imparfait-q15","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"La rédaction était déjà en cours à l’arrivée de Malik. Choisissez écrire pour décrire cette activité.","sentenceFr":"Elle ____ un message quand Malik est arrivé.","targetSkill":"passe-compose-imparfait.encours","targetStructure":"encours","topicIds":["passe-compose-imparfait.encours"],"options":[{"id":"a","textFr":"écrivait"},{"id":"b","textFr":"a écrit"},{"id":"c","textFr":"écrivaient"},{"id":"d","textFr":"écrit"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"Elle écrivait un message quand Malik est arrivé.","explanationPt":"Écrivait observa a escrita em andamento. A chegada não implica que a mensagem nunca foi terminada. A écrit apresenta a redação como acontecimento; a instrução pede o processo já em curso. Écrivaient não concorda com elle; écrit isolado aqui corresponderia ao presente.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":4},{"id":"passe-compose-imparfait-q16","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Présentez la journée de huit heures comme un épisode entier. Choisissez travailler avec je.","sentenceFr":"Samedi, ____ pendant huit heures, puis j’ai fermé le dossier.","targetSkill":"passe-compose-imparfait.duree","targetStructure":"duree","topicIds":["passe-compose-imparfait.duree"],"options":[{"id":"a","textFr":"je travaillais"},{"id":"b","textFr":"j’ai travaillé"},{"id":"c","textFr":"j’ai travailler"},{"id":"d","textFr":"j’a travaillé"}],"correctOptionId":"b","acceptedAnswers":[],"completedSentenceFr":"Samedi, j’ai travaillé pendant huit heures, puis j’ai fermé le dossier.","explanationPt":"A duração longa pertence a um episódio global antes do fechamento ; ai travaillé é a estrutura composta adequada à perspectiva solicitada. Je travaillais pode construir um pano de fundo, mas o enunciado pede o episódio inteiro. A duração de oito horas não determina sozinha o tempo verbal.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":5},{"id":"passe-compose-imparfait-q17","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Racontez l’obtention de l’information à cet instant précis, et non un savoir déjà installé. Choisissez savoir avec je.","sentenceFr":"____ où était la salle au moment où l’accueil a envoyé le plan.","targetSkill":"passe-compose-imparfait.paires-sens","targetStructure":"paires-sens","topicIds":["passe-compose-imparfait.paires-sens"],"options":[{"id":"a","textFr":"Je savais"},{"id":"b","textFr":"J’ai savoir"},{"id":"c","textFr":"J’ai su"},{"id":"d","textFr":"Je sais"}],"correctOptionId":"c","acceptedAnswers":[],"completedSentenceFr":"J’ai su où était la salle au moment où l’accueil a envoyé le plan.","explanationPt":"Ai su apresenta a obtenção da informação no cenário. Savais descreveria conhecimento já disponível, outra perspectiva. Je savais descreve um conhecimento já existente, não sua aquisição nesse momento. A distinção resulta da perspectiva explicitada, não de uma palavra-chave automática.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":6},{"id":"passe-compose-imparfait-q18","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Décrivez le logement comme une situation qui durait déjà depuis deux mois au moment de la rencontre.","sentenceFr":"J’____ dans cet appartement depuis deux mois quand j’ai rencontré ma voisine.","targetSkill":"passe-compose-imparfait.marqueurs","targetStructure":"marqueurs","topicIds":["passe-compose-imparfait.marqueurs"],"options":[{"id":"a","textFr":"ai habité"},{"id":"b","textFr":"habitait"},{"id":"c","textFr":"habitent"},{"id":"d","textFr":"habitais"}],"correctOptionId":"d","acceptedAnswers":[],"completedSentenceFr":"J’habitais dans cet appartement depuis deux mois quand j’ai rencontré ma voisine.","explanationPt":"Depuis se liga ao ponto passado do encontro ; habitais descreve a situação em curso até essa referência, não necessariamente até hoje. Ai habité apresentaria a moradia como um episódio delimitado. A instrução pede a situação que já durava no momento passado de referência; habitait e habitent não concordam com je.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":7},{"id":"passe-compose-imparfait-q19","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Décrivez l’intention de fond, sans raconter une tentative précise. Choisissez vouloir avec nous.","sentenceFr":"À cette époque, nous ____ surtout comprendre les annonces de la gare.","targetSkill":"passe-compose-imparfait.strategie","targetStructure":"strategie","topicIds":["passe-compose-imparfait.strategie"],"options":[{"id":"a","textFr":"voulions"},{"id":"b","textFr":"avons voulu"},{"id":"c","textFr":"voulaient"},{"id":"d","textFr":"vouliez"}],"correctOptionId":"a","acceptedAnswers":[],"completedSentenceFr":"À cette époque, nous voulions surtout comprendre les annonces de la gare.","explanationPt":"Voulions descreve a intenção habitual/de fundo da época. Um episódio de tentativa poderia adotar outra perspectiva. Avons voulu poderia focalizar uma vontade ou tentativa delimitada; o contexto pede a intenção de fundo. Voulaient e vouliez não concordam com nous.","targetTense":"imparfait","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":8},{"id":"passe-compose-imparfait-q20","moduleId":"passe-compose-imparfait","bankId":"passe-compose-imparfait","type":"mcq","instructionFr":"Après le retour de la lumière, racontez que la soupe a effectivement été terminée. Choisissez terminer avec je.","sentenceFr":"La lumière est revenue. ____ la soupe et nous avons mangé.","targetSkill":"passe-compose-imparfait.recit","targetStructure":"recit","topicIds":["passe-compose-imparfait.recit"],"options":[{"id":"a","textFr":"Je terminais"},{"id":"b","textFr":"J’ai terminé"},{"id":"c","textFr":"J’ai terminer"},{"id":"d","textFr":"J’a terminé"}],"correctOptionId":"b","acceptedAnswers":[],"completedSentenceFr":"La lumière est revenue. J’ai terminé la soupe et nous avons mangé.","explanationPt":"O resultado obtido entra na sequência de acontecimentos. A preparação antes descrita no imperfeito pôde ser concluída normalmente. Je terminais colocaria a ação em andamento, sem por si só apresentar o resultado obtido que se pede aqui. As outras formas erram o particípio ou o auxiliar.","targetTense":"passé composé","group":"bank","sourceRef":"19.json / questions; conversion from MCQ_001 when type=fill","helpIndex":9},{"id":"passe-compose-imparfait-dq1","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Qu’est-ce qui a changé : l’heure ou l’accès à la salle ?","sentenceFr":"","options":[{"id":"a","textFr":"L’accès à la salle ; l’heure est restée la même."},{"id":"b","textFr":"L’heure ; l’accès est resté le même."},{"id":"c","textFr":"Le nom de la formatrice seulement."},{"id":"d","textFr":"Le prix du cours seulement."}],"correctOptionId":"a","explanationPt":"O diálogo distingue a informação estável do elemento alterado.","topicIds":["passe-compose-imparfait.cadre-evenement"],"helpIndex":2,"group":"context","sourceRef":"19.json / dialogue.questions or reading.questions"},{"id":"passe-compose-imparfait-dq2","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Clara connaissait-elle déjà la nouvelle entrée ?","sentenceFr":"","options":[{"id":"a","textFr":"Oui. Elle connaissait déjà toutes les entrées."},{"id":"b","textFr":"Non. Elle a demandé un plan."},{"id":"c","textFr":"Oui. Elle avait elle-même fermé la salle."},{"id":"d","textFr":"Le dialogue affirme qu’elle est restée chez elle."}],"correctOptionId":"b","explanationPt":"A pergunta com savais e a resposta negativa preparam o acontecimento de obter orientação.","topicIds":["passe-compose-imparfait.paires-sens"],"helpIndex":6,"group":"context","sourceRef":"19.json / dialogue.questions or reading.questions"},{"id":"passe-compose-imparfait-dq3","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Clara a-t-elle finalement participé à une activité ?","sentenceFr":"","options":[{"id":"a","textFr":"Non. Elle n’a participé à aucune activité."},{"id":"b","textFr":"Oui, uniquement à la première activité."},{"id":"c","textFr":"Oui, à la deuxième activité."},{"id":"d","textFr":"Non. Elle n’est jamais arrivée au centre."}],"correctOptionId":"c","explanationPt":"J’ai pu participer é acompanhado de resultado explícito, confirmando realização.","topicIds":["passe-compose-imparfait.paires-sens"],"helpIndex":6,"group":"context","sourceRef":"19.json / dialogue.questions or reading.questions"},{"id":"passe-compose-imparfait-rq1","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Quelles activités étaient en cours avant la coupure ?","sentenceFr":"","options":[{"id":"a","textFr":"La fin du repas et le départ d’Ana."},{"id":"b","textFr":"La recherche d’une lampe et le retour de la lumière."},{"id":"c","textFr":"L’achat du pain et la réservation d’une table."},{"id":"d","textFr":"La préparation du dîner et la lecture d’un message."}],"correctOptionId":"d","explanationPt":"As formas préparais, lisait e coupais montam a cena em desenvolvimento.","topicIds":["passe-compose-imparfait.encours"],"helpIndex":4,"group":"context","sourceRef":"19.json / dialogue.questions or reading.questions"},{"id":"passe-compose-imparfait-rq2","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"La soupe est-elle restée inachevée ?","sentenceFr":"","options":[{"id":"a","textFr":"Non. La personne a terminé la soupe après le retour de la lumière."},{"id":"b","textFr":"Oui. Le texte dit que la soupe a été jetée."},{"id":"c","textFr":"Oui. Préparais signifie que la soupe n’a jamais été terminée."},{"id":"d","textFr":"Le texte dit qu’ils ont mangé au restaurant."}],"correctOptionId":"a","explanationPt":"O resultado posterior é explícito ; não se pode deduzir inacabamento do imperfeito.","topicIds":["passe-compose-imparfait.encours"],"helpIndex":4,"group":"context","sourceRef":"19.json / dialogue.questions or reading.questions"},{"id":"passe-compose-imparfait-rq3","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Quels événements structurent la deuxième partie ?","sentenceFr":"","options":[{"id":"a","textFr":"La pluie, la chaleur de la cuisine et l’habitude de réviser."},{"id":"b","textFr":"La coupure de lumière, la recherche d’une lampe, le retour de la lumière et la fin du repas."},{"id":"c","textFr":"Le voyage en train, l’arrivée au centre et le changement de salle."},{"id":"d","textFr":"La routine de chaque mardi et les six trajets du stage."}],"correctOptionId":"b","explanationPt":"Eles formam uma sequência recortada, enquanto o primeiro parágrafo apresenta o contexto.","topicIds":["passe-compose-imparfait.recit"],"helpIndex":9,"group":"context","sourceRef":"19.json / dialogue.questions or reading.questions"},{"id":"passe-compose-imparfait-ecoute-q01","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Quelle différence y a-t-il entre j’attendais et j’ai attendu dans ce message ?","sentenceFr":"","options":[{"id":"a","textFr":"J’attendais décrit l’activité à dix-huit heures ; j’ai attendu donne le bilan de toute l’attente."},{"id":"b","textFr":"J’attendais indique une attente future ; j’ai attendu indique une habitude actuelle."},{"id":"c","textFr":"J’attendais prouve que le bus n’est jamais arrivé ; j’ai attendu prouve qu’il est arrivé."},{"id":"d","textFr":"Les deux formes imposent deux attentes différentes, sans lien entre elles."}],"correctOptionId":"a","explanationPt":"As duas formas podem falar da mesma espera sob perspectivas diferentes. Vinte minutos não força um tempo específico ; o enquadramento da frase é que muda.","topicIds":["passe-compose-imparfait.duree"],"helpIndex":5,"group":"sound","sourceRef":"19.json / listening"},{"id":"passe-compose-imparfait-sons-q01","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Dans « j’ai parlé », quelle structure repérez-vous ?","sentenceFr":"","options":[{"id":"a","textFr":"Un imparfait simple, sans auxiliaire."},{"id":"b","textFr":"Un auxiliaire au présent et un participe passé."},{"id":"c","textFr":"Un futur simple avec une terminaison en -ai."},{"id":"d","textFr":"Un infinitif précédé d’une préposition."}],"correctOptionId":"b","explanationPt":"J’ai é o auxiliar e parlé é o particípio. Observe a estrutura inteira; a percepção de é/ais varia entre falantes.","topicIds":["passe-compose-imparfait.pc-forme"],"helpIndex":0,"group":"sound","sourceRef":"19.json / pronunciation; authorial MCQ adaptation"},{"id":"passe-compose-imparfait-sons-q02","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Quelle phrase est à l’imparfait, sans auxiliaire ?","sentenceFr":"","options":[{"id":"a","textFr":"Nous avons travaillé."},{"id":"b","textFr":"Elle est arrivée."},{"id":"c","textFr":"Nous travaillions."},{"id":"d","textFr":"J’ai parlé."}],"correctOptionId":"c","explanationPt":"Nous travaillions é uma forma simples com a terminação -ions. As outras propostas contêm auxiliar e particípio.","topicIds":["passe-compose-imparfait.imp-forme"],"helpIndex":1,"group":"sound","sourceRef":"19.json / pronunciation; authorial MCQ adaptation"},{"id":"passe-compose-imparfait-sons-q03","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Pour distinguer j’ai parlé et je parlais, quel repère est le plus prudent ?","sentenceFr":"","options":[{"id":"a","textFr":"Se fier uniquement à l’ouverture de la voyelle finale."},{"id":"b","textFr":"Considérer toutes les finales -é et -ais comme identiques à l’écrit."},{"id":"c","textFr":"Choisir le temps d’après la vitesse de la voix."},{"id":"d","textFr":"Examiner le contexte et la présence de l’auxiliaire, en plus de l’écoute."}],"correctOptionId":"d","explanationPt":"Compare j’ai parlé e je parlais : em muitas variedades, o particípio em é e o imperfeito em ais podem apresentar diferença de abertura vocálica, mas há variação e essa oposição não é confiável como único critério. Procure também o auxiliar j’ai, ausente em je parlais. O mesmo raciocínio vale para nous avons travaillé e nous travaillions, em que a estrutura completa é mais perceptível.","topicIds":["passe-compose-imparfait.pc-forme"],"helpIndex":0,"group":"sound","sourceRef":"19.json / pronunciation; authorial MCQ adaptation"},{"id":"passe-compose-imparfait-ecrit-q01","moduleId":"passe-compose-imparfait","type":"mcq","instructionFr":"Dans le modèle du repas avec Ana et Malik, quelle phrase installe le cadre ?","sentenceFr":"","options":[{"id":"a","textFr":"Il pleuvait et nous ne voulions pas sortir."},{"id":"b","textFr":"J’ai appelé Malik."},{"id":"c","textFr":"Il a reçu un message."},{"id":"d","textFr":"Nous avons terminé la préparation."}],"correctOptionId":"a","explanationPt":"Il pleuvait e nous ne voulions pas descrevem as circunstâncias e a intenção de fundo; as outras frases apresentam acontecimentos.","topicIds":["passe-compose-imparfait.cadre-evenement"],"helpIndex":2,"group":"application","sourceRef":"19.json / openTasks or reading.mediation; authorial MCQ adaptation"},{"id":"passe-compose-imparfait-ecr  }
 const p=pendingImport,legacy=p.kind==='legacy',count=legacy?Object.keys(p.data.history).length:Object.keys(p.data.answers).length;
 openModal(`<span class="tag ${legacy?'tag-neutral':''}">SAUVEGARDE VALIDÉE · ${legacy?'BASE 0.2':'PILOTE U19'}</span><h2 id="modal-title" style="margin-top:14px">${legacy?'Conserver votre ancien historique ?':'Reprendre depuis cette copie ?'}</h2><div class="import-summary"><div class="import-metric"><b>${count}</b><small>${legacy?'banques avec résultats':'questions explorées'}</small></div><div class="import-metric"><b>${legacy?Object.keys(p.data.drafts).length:U.sections.filter(s=>p.data.marks[s.id]).length}</b><small>${legacy?'brouillons conservés':'fiches étudiées'}</small></div></div><p lang="pt-BR">${legacy?'Os resultados e rascunhos da versão 0.2 serão preservados separadamente. Suas respostas atuais do piloto não serão substituídas. O arquivo original também permanece intacto.':'Ao confirmar, o progresso atual deste piloto será substituído pela cópia selecionada, inclusive a série em andamento. Exporte o estado atual antes de continuar para manter as duas versões.'}</p><div class="dialog-actions">${btn('Annuler','close-modal','button-outline')}${btn('Exporter l’état actuel','export','button-outline')}${btn(legacy?'Conserver l’historique':'Remplacer ma progression','confirm-import','button-primary')}</div>`);
}
function confirmImport(){if(!pendingImport)return;const p=pendingImport;if(p.kind==='legacy')state.legacy=p.data;else state=p.data;stopAudio(false);storageOK=true;storageIssue='';save();const step=state.resume.step,topic=state.resume.topic;closeModal();go(p.kind==='legacy'?'progres':'unite',step,topic);toast(storageOK?'Sauvegarde importée. Votre progression a été restaurée.':'Importée en mémoire. Exportez avant de fermer : stockage indisponible.');}
function about(){openModal(`<h2 id="modal-title">Un guide pour comprendre.</h2><p lang="pt-BR">Piloto funcional da U19 do Atelier français A2 / Projet Renan. O conteúdo deriva da unidade recebida, com reorganização visual e conversões editoriais para múltipla escolha. A revisão pedagógica final do coordenador permanece necessária.</p><h3>Dans cette version</h3><ul class="modal-list"><li>36 unités dans le sommaire ; seule l’unité 19 est interactive dans le nouveau format.</li><li>10 fiches, 16 exemples, 46 questions distinctes, drills et sauvegarde portable.</li><li>Aucun compte, aucune correction par IA ou tuteur, aucune note de prononciation.</li></ul><h3>Documents de référence</h3><p class="small" lang="pt-BR">A2.zip · U19 (19.json) et propositions MCQ_001 ; PROJET RENAN ; SCHÉMA D’APPRENTISSAGE PAR NIVEAUX ; STRUCTURE TYPE D’UNE UNITÉ PÉDAGOGIQUE.</p><h3>Ressources liées à la base</h3>${D.references.map(r=>`<div class="reference"><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)} ${ic('external',11)}</a><small>${esc(r.institution)} · référence héritée de la base, non revalidée dans ce pilote.</small></div>`).join('')}<h3>Vidéo provisoire</h3><div class="reference"><a href="${esc(D.videos[0].sourceUrl)}" target="_blank" rel="noopener noreferrer">${esc(D.videos[0].channel)} · ${esc(D.videos[0].title)}</a><small>Source repérée le 28/09/2026. La lecture et l’autorisation d’intégration dépendent de YouTube et du contexte d’ouverture.</small></div><h3>Fonctionnement & confidentialité</h3><p class="small" lang="pt-BR">HTML + Tailwind CSS compilado + JavaScript. O progresso fica no navegador, sem envio para servidor. O Google Fonts fornece a Inter quando há internet; offline, usa-se uma fonte sem serifa do sistema. O YouTube só é conectado quando você carrega o player ou abre o link. A síntese vocal usa as vozes disponíveis no navegador.</p><p class="small muted" style="margin-top:13px">Version ${esc(D.version)} · 28/09/2026.</p><div class="dialog-actions">${btn('Fermer','close-modal','button-outline')}</div>`);}
function stopAudio(show=true){speechToken++;try{window.speechSynthesis?.cancel();}catch(e){}utterances=[];if(show)audioStatus('Lecture arrêtée.');}
function audioStatus(t){const e=document.getElementById('audio-status');if(e)e.textContent=t;else toast(t);announce(t);}
function speak(text,listening=false){
 stopAudio(false);const synth=window.speechSynthesis;
 if(!synth||typeof window.SpeechSynthesisUtterance==='undefined'){audioStatus('Synthèse vocale indisponible. Utilisez le texte comme lecture de secours.');document.getElementById('listening-transcript')?.setAttribute('open','');return;}
 let voices=[];try{voices=synth.getVoices().filter(v=>/^fr([_-]|$)/i.test(v.lang));}catch(e){}
 if(!navigator.onLine)voices=voices.filter(v=>v.localService);
 const v=voices.find(v=>v.localService&&/^fr[-_]FR$/i.test(v.lang))||voices.find(v=>v.localService)||voices.find(v=>/^fr[-_]FR$/i.test(v.lang))||voices[0];
 if(!v){audioStatus('Aucune voix française disponible. Ouvrez la transcription pour travailler en lecture ; vous pouvez réessayer si les voix se chargent.');document.getElementById('listening-transcript')?.setAttribute('open','');return;}
 const token=speechToken;const chunks=(String(text).match(/[^.!?…]+[.!?…]*\s*/g)||[String(text)]).flatMap(x=>x.length<240?[x]:(x.match(/.{1,220}(?:\s|$)|\S+$/g)||[x]));
 utterances=chunks.map(t=>{const u=new SpeechSynthesisUtterance(t);u.voice=v;u.lang=v.lang;u.rate=.9;return u;});
 function play(i){if(token!==speechToken)return;if(i>=utterances.length){audioStatus('Lecture terminée · voix de synthèse.');utterances=[];return;}const u=utterances[i];u.onend=()=>play(i+1);u.onerror=()=>{if(token===speechToken){audioStatus('Lecture audio impossible. Le texte reste disponible.');if(listening){state.listeningMode='text';save();}}};try{synth.speak(u);}catch(e){audioStatus('Lecture impossible. Utilisez le texte.');}}
 if(listening){state.listeningMode='synthesis';save();}audioStatus('Lecture en cours · '+v.name+(v.localService?' · voix locale.':' · voix pouvant nécessiter internet.'));play(0);
}
function loadVideo(){const c=document.getElementById('video-container');if(!c)return;c.className='';c.innerHTML=`<iframe title="${esc(D.videos[0].title)}" src="https://www.youtube-nocookie.com/embed/${D.videos[0].id}?rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe>`;announce('Lecteur YouTube chargé. Le lien Ouvrir sur YouTube reste disponible si la lecture est bloquée.');}
// All interactive state changes go through user actions and canonical content IDs.
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='resume')resume();
 else if(a==='go')go(b.dataset.view);
 else if(a==='step')go('unite',b.dataset.step,0);
 else if(a==='topic')go('unite','learn',Number(b.dataset.topic));
 else if(a==='locate')locate(b.dataset.unit);
 else if(a==='preview')previewUnit(b.dataset.unit);
 else if(a==='font'){state.prefs.largeText=!state.prefs.largeText;save();render(true);}
 else if(a==='focus'){state.prefs.focus=!state.prefs.focus;save();render(true);}
 else if(a==='bookmark'){const s=U.sections[Number(b.dataset.topic)];state.bookmarks[s.id]=!state.bookmarks[s.id];save();render(true);toast(state.bookmarks[s.id]?'Fiche ajoutée aux révisions.':'Fiche retirée des révisions.');}
 else if(a==='check')recordAnswer(b.dataset.key);
 else if(a==='next')nextQuestion(b.dataset.key);
 else if(a==='restart'){const key=b.dataset.key,s=state.sessions[key];if(s){newSession(key,s.ids);render(true);MAIN.querySelector(`[data-session="${key}"] legend`)?.focus({preventScroll:true});}}
 else if(a==='help'){returnStep=b.dataset.from||'exercises';go('unite','learn',Number(b.dataset.topic));}
 else if(a==='return-quiz'){const step=returnStep||'exercises';returnStep=null;if(step==='revisions')go('revisions');else go('unite',step,0);}
 else if(a==='context-tab'){stopAudio(false);state.contextTab=b.dataset.tab;save();render(true);}
 else if(a==='translations'){document.querySelectorAll('.pt-line').forEach(p=>p.hidden=!p.hidden);}
 else if(a==='drill'){
  const def=DRILLS[Number(b.dataset.drill)];if(!def)return;
  const pool=D.groups.bank.filter(id=>def.topics.includes(Q.get(id).helpIndex));
  if(pool.length<6){toast('Cette série ne dispose pas encore de six questions.');return;}
  newSession('drill',seedShuffle(pool,Math.floor(Math.random()*2147483645)+1).slice(0,6));render(true);MAIN.querySelector('[data-session="drill"]').scrollIntoView({block:'start',behavior:'smooth'});
 }
 else if(a==='review-errors'){const ids=wrongIds();if(!ids.length)return;newSession('review',ids);render(true);MAIN.querySelector('[data-session="review"]').scrollIntoView({block:'start',behavior:'smooth'});}
 else if(a==='backup')backupModal();
 else if(a==='close-modal')closeModal();
 else if(a==='modal-resume'){closeModal();resume();}
 else if(a==='export')exportProgress();
 else if(a==='import'){const f=document.getElementById('import-file');f.value='';f.click();}
 else if(a==='confirm-import')confirmImport();
 else if(a==='legacy-local'){try{importRaw(JSON.parse(localStorage.getItem(OLD_KEY)));}catch(err){toast(err.message||'Ancienne sauvegarde illisible.');}}
 else if(a==='reset-dialog')openModal(`<h2 id="modal-title">Réinitialiser ce pilote ?</h2><p lang="pt-BR">Esta ação apaga apenas o progresso deste piloto U19 neste navegador, incluindo o histórico antigo anexado à sua cópia. Não altera o arquivo do curso nem o armazenamento original da versão 0.2. Exporte uma cópia antes de confirmar.</p><div class="dialog-actions">${btn('Annuler','close-modal','button-outline')}${btn('Exporter d’abord','export','button-outline')}${btn('Effacer le progrès du pilote','reset-confirm','button-danger')}</div>`);
 else if(a==='reset-confirm'){stopAudio(false);state=fresh();storageOK=true;storageIssue='';save();closeModal();go('parcours');toast('Progression du pilote réinitialisée.');}
 else if(a==='about')about();
 else if(a==='table')openModal(`<h2 id="modal-title">Deux temps, deux perspectives</h2>${comparisonTable()}<div class="dialog-actions">${btn('Fermer','close-modal','button-outline')}</div>`);
 else if(a==='load-video')loadVideo();
 else if(a==='speak-listening')speak(U.listening.stimulusFr,true);
 else if(a==='speak-dialogue')speak(U.dialogue.turns.map(x=>x.fr).join(' '));
 else if(a==='speak-reading')speak(U.reading.paragraphsFr.join(' '));
 else if(a==='speak-example'){const ex=U.examples.find(x=>x.id===b.dataset.example);if(ex)speak(ex.fr);}
 else if(a==='speak-sample')speak(U.pronunciation.samplesFr[Number(b.dataset.sample)]);
 else if(a==='stop-audio')stopAudio();
});
document.addEventListener('input',e=>{if(e.target.id==='unit-search'){searchText=e.target.value;document.getElementById('path-blocks').innerHTML=renderPath();}});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.quiz){const key=t.dataset.quiz,s=state.sessions[key];if(!s||s.finishedAt)return;const id=s.ids[s.index];if(s.submitted[id]||!optionExists(id,t.value))return;s.selected[id]=t.value;save();const check=document.querySelector(`[data-action="check"][data-key="${key}"]`);if(check)check.disabled=false;}
 else if(t.dataset.read){if(!U.sections.some(s=>s.id===t.dataset.read))return;state.marks[t.dataset.read]=t.checked;save();render(true);announce(t.checked?'Lecture de la fiche enregistrée.':'Déclaration de lecture retirée.');}
 else if(t.id==='topic-select')go('unite','learn',Number(t.value));
});
document.getElementById('import-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;if(f.size>3_000_000){toast('Fichier trop volumineux. Limite : 3 Mo. Aucun changement effectué.');return;}try{const text=await f.text();importRaw(JSON.parse(text));}catch(err){pendingImport=null;toast(err instanceof SyntaxError?'Ce fichier ne contient pas un JSON valide. Aucun changement effectué.':(err.message||'Sauvegarde invalide. Aucun changement effectué.'));}});
MODAL.addEventListener('click',e=>{if(e.target===MODAL){const r=MODAL.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
MODAL.addEventListener('cancel',()=>{pendingImport=null;});
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){MAIN.focus();return;}stopAudio(false);parseRoute();render();});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){storageOK=false;storageIssue='La progression a changé dans un autre onglet. Exportez cette visite avant de recharger pour éviter de remplacer les modifications de l’autre onglet.';storageUI();}});
window.addEventListener('pagehide',()=>stopAudio(false));
// Progressive enhancement only: file:// works without fetch or a server.
parseRoute();render();storageUI();
})();
</script>
